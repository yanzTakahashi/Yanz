<!DOCTYPE html>
<html lang="id">
<head>

  <title>Yanz Takahashi | VTuber</title>
  <style>
    *{box-sizing:border-box}

      border-radius:11px;background:#20202a;border:1px solid #2d2d38;
      color:#fff;text-decoration:none;font-weight:650

    a:hover{background:#292934}
    .support{
      text-align:center;color:#9999a6;font-size:11px;
      text-transform:uppercase;letter-spacing:1.4px;margin:20px 0 9px
